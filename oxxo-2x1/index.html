<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>2x1 OXXO · Vitad</title>
<link rel="icon" href="../favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f4f7f8;--surface:#fff;--line:#d9e2e5;--ink:#101820;--muted:#5b6670;--accent:#00879B;--accent-2:#00BED6;
--accent-ink:#fff;--soft:#e3f5f8;--bad:#b42318;--logo:url("../logo_vitad_oscuro.png");color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1418;--surface:#131f25;--line:#26363e;--ink:#e8eef0;--muted:#94a3ab;
--accent:#22c3d9;--accent-2:#00BED6;--accent-ink:#04191d;--soft:#12313a;--bad:#f07a70;--logo:url("../logo_vitad_claro.png");color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.logo{display:block;width:150px;height:51px;background:var(--logo) no-repeat left center/contain}
h1,h2{font-family:"Archivo","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
a{color:var(--accent)}
footer{margin-top:auto;padding:20px 16px;text-align:center;color:var(--muted);font-size:.82rem}

main{flex:1;display:grid;place-items:center;padding:24px 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.logo{width:120px;height:41px}
h1{font-size:1.35rem}p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password],input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.7;cursor:wait}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
label{font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center}#err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.volver{font-size:.88rem;text-decoration:none}
</style></head><body><main>
<form id="f"><span class="logo" role="img" aria-label="Vitad"></span><h1>2x1 OXXO</h1>
<p>Uso interno de Vitad y Alquería. Entre con su usuario y su clave.</p>
<input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuario" aria-label="Usuario" autofocus>
<input type="password" id="k" autocomplete="current-password" placeholder="Clave" aria-label="Clave">
<label><input type="checkbox" id="r"> Recordar en este equipo</label>
<button type="submit" id="b">Entrar</button><div id="err" role="alert"></div>
<a class="volver" href="../">← Todos los tableros</a></form></main>

  u=(u||"").trim().toLowerCase();if(!u||!c){$("err").textContent="Escriba usuario y clave.";return;}
  $("b").textContent="Abriendo...";$("b").disabled=true;let r;
  try{r=await abrir(u,c);}
  catch(e){$("b").textContent="Entrar";$("b").disabled=false;
    $("err").textContent=recordada?"Su acceso cambió. Escriba de nuevo su usuario y su clave.":"Usuario o clave incorrectos, o sin acceso a este tablero.";
    try{sessionStorage.removeItem(K);if(recordada)localStorage.removeItem(K)}catch(_){}
    registrar(u,recordada?"fallido (recordado)":"fallido");return;}
  const v=JSON.stringify({u:u,c:c});try{sessionStorage.setItem(K,v);if(guardar)localStorage.setItem(K,v);}catch(e){}
  registrar(u,recordada?"entrada (recordada)":"entrada",r[0]);
  await new Promise(ok=>setTimeout(ok,200));
  document.open();document.write(r[1]);document.close();
}
$("f").addEventListener("submit",e=>{e.preventDefault();intentar($("u").value,$("k").value,$("r").checked,false);});

if(g&&g.u){$("u").value=g.u;intentar(g.u,g.c,local,true);}
